<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | Help Center</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #1e293b;
            --light: #f8fafc;
            --text: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            padding: 60px 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text);
        }

        .support-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .email-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }

        .email-link:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .faq-section {
            margin-top: 60px;
        }

        .faq-item {
            margin-bottom: 20px;
        }

        .faq-item h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            margin-top: 80px;
            font-size: 0.9rem;
            color: var(--text);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>How can we help?</h1>
            <p class="subtitle">We’re here to ensure you have the best experience possible.</p>
        </header>

        <main>
            <section class="support-card">
                <h2>Contact Support</h2>
                <p>Have a question or running into an issue? Drop us a line and our team will get back to you within 24 hours.</p>
                <a href="mailto:mwenzel164@gmail.com" class="email-link">Email: mwenzel164@gmail.com</a>
            </section>
        </main>

        <footer>
            &copy; 2026 Savior Systems. All rights reserved.
        </footer>
    </div>

</body>
</html>
